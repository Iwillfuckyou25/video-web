<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upload</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #ff5a3c;
    --text: #f2f2f2;
    --muted: #9aa0a8;
    --error: #ff4d4d;
    --success: #3ddc84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,90,60,0.15), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(90,140,255,0.10), transparent 45%),
      var(--bg);
    color: var(--text);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px 60px;
    perspective: 1000px;
  }
  .box {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(160deg, #20242d, #14161b);
    border-radius: 18px;
    padding: 26px;
    border: 1px solid #262a33;
    transform: perspective(800px) rotateX(2deg);
    box-shadow:
      0 25px 50px rgba(0,0,0,0.45),
      0 8px 16px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  .sub { color: var(--muted); font-size: 13px; text-align: center; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  input[type=password], textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2c2f38;
    background: #0f1115;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }
  .file-input {
    margin-top: 6px;
    padding: 22px;
    border: 2px dashed #2c2f38;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
    background: linear-gradient(160deg, #171a20, #0f1115);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
    transition: transform 0.1s, border-color 0.2s;
  }
  .file-input:active { transform: scale(0.98); }
  .file-input.has-file {
    border-color: var(--accent);
    color: var(--text);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,90,60,0.3);
  }
  input[type=file] { display: none; }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(160deg, #ff6b4d, var(--accent));
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow:
      0 8px 16px rgba(255,90,60,0.3),
      0 2px 4px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transform: translateY(0);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active {
    transform: translateY(2px);
    box-shadow:
      0 4px 8px rgba(255,90,60,0.25),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 18px; }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }
  .progress-wrap {
    margin-top: 14px;
    height: 8px;
    background: #0f1115;
    border-radius: 6px;
    overflow: hidden;
    display: none;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.2s;
  }
  a.gallery-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>🔒 Upload</h1>
    <p class="sub">Password, description aur video daalo</p>

    <form id="uploadForm">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <label for="description">Description</label>
      <textarea id="description" required placeholder="Video ke baare me likho..."></textarea>

      <label>Video</label>
      <div class="file-input" id="fileLabel" onclick="document.getElementById('videoFile').click()">
        Tap karke video chuno ya record karo
      </div>
      <input type="file" id="videoFile" accept="video/*" required />

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <button type="submit" id="submitBtn">Upload Karo</button>
      <div class="msg" id="msg"></div>
    </form>

    <a class="gallery-link" href="/">← Gallery dekho</a>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('videoFile');
    const fileLabel = document.getElementById('fileLabel');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        fileLabel.textContent = '✓ ' + fileInput.files[0].name;
        fileLabel.classList.add('has-file');
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'msg';

      const password = document.getElementById('password').value;
      const description = document.getElementById('description').value;
      const file = fileInput.files[0];

      if (!file) {
        msg.textContent = 'Video chuno pehle';
        msg.className = 'msg error';
        return;
      }

      const fd = new FormData();
      fd.append('password', password);
      fd.append('description', description);
      fd.append('video', file);

      submitBtn.disabled = true;
      submitBtn.textContent = 'Upload ho raha hai...';
      progressWrap.style.display = 'block';

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');

      xhr.upload.addEventListener('progress', (evt) => {
        if (evt.lengthComputable) {
          const pct = Math.round((evt.loaded / evt.total) * 100);
          progressBar.style.width = pct + '%';
        }
      });

      xhr.onload = () => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Upload Karo';
        progressWrap.style.display = 'none';
        progressBar.style.width = '0%';

        let data = {};
        try { data = JSON.parse(xhr.responseText); } catch (e) {}

        if (xhr.status === 201) {
          msg.textContent = '✓ Upload ho gaya! Gallery par jaake dekho.';
          msg.className = 'msg success';
          form.reset();
          fileLabel.textContent = 'Tap karke video chuno ya record karo';
          fileLabel.classList.remove('has-file');
        } else {
          msg.textContent = data.error || 'Kuch galat ho gaya';
          msg.className = 'msg error';
        }
      };

      xhr.onerror = () => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Upload Karo';
        progressWrap.style.display = 'none';
        msg.textContent = 'Network error, dobara try karo';
        msg.className = 'msg error';
      };

      xhr.send(fd);
    });
  </script>
</body>
</html>
